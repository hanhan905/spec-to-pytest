[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spec-to-pytest"
version = "0.1.0.dev0"
description = "Local-first, evidence-checked AI-assisted Playwright testing workbench"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
  "filelock>=3.16,<4",
  "anyio>=4.9,<4.15", # Starlette TestClient compatibility; exercised by the locked test suite.
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pillow>=11.3,<13",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "allure-pytest>=2.15,<3",
  "httpx2>=2,<3", # Starlette 1.x TestClient transport.
  "playwright>=1.55,<2",
  "pytest>=8.4,<10",
  "pytest-playwright>=0.7,<1",
]
dev = [
  "mypy>=1.17,<2",
  "pre-commit>=4.3,<5",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["framework", "practice_app", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "generated", "build", "dist", "node_modules"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
log_cli = false
log_cli_level = "INFO"
markers = [
  "smoke: the fastest critical-path checks",
  "regression: the broader regression suite",
  "ui: browser-based user-interface tests",
  "api: HTTP API tests",
  "contract: mock or service contract checks",
  "flaky_demo: intentionally unstable teaching examples excluded by default",
  "generated: tests generated by the TRAE workflow",
  "ai_demo: local AI-driven testing demonstration",
  "case_id(value): explicit plan case identifier",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:multipart.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["reports", "test-results", ".local", ".uv-cache*", ".npm-cache*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = ["reports", "test-results", ".local"]
