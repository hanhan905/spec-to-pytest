{% extends "base.html" %}
{% block title %}内容广场 - Playwright Test Lab{% endblock %}
{% block content %}
  <section aria-labelledby="feed-title">
    <div class="page-heading-row">
      <div>
        <h1 id="feed-title">内容广场</h1>
      </div>
      <a class="primary-link" href="/publish">发布内容</a>
    </div>

    <form class="search-row" id="search-form" role="search">
      <label class="sr-only" for="post-search">搜索标题、正文或标签</label>
      <div class="search-field">
        <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>
        <input
          id="post-search"
          name="q"
          type="search"
          placeholder="搜索标题、正文或标签"
          autocomplete="off"
        />
      </div>
      <button class="primary-button" type="submit">搜索</button>
    </form>

    <p class="status-panel" id="feed-status" aria-live="polite">正在加载内容…</p>
    <div class="post-list" id="post-list" aria-live="polite"></div>
  </section>
{% endblock %}
{% block scripts %}<script src="/static/feed.js"></script>{% endblock %}
