<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Playwright Test Lab{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav" aria-label="主导航">
        <a class="brand" href="/dashboard">Playwright Test Lab</a>
        <div class="nav-links">
          <a class="nav-link{% if active_page == 'feed' %} active{% endif %}" href="/feed">内容广场</a>
          <a class="nav-link{% if active_page == 'publish' %} active{% endif %}" href="/publish">发布内容</a>
        </div>
        <div class="account-actions">
          <span data-testid="current-user">{{ user.username }}</span>
          <button class="text-button" id="logout" type="button">退出</button>
        </div>
      </nav>
    </header>
    <main class="page-shell">{% block content %}{% endblock %}</main>
    <script>
      document.querySelector('#logout').addEventListener('click', async () => {
        await fetch('/api/logout', {method: 'POST'});
        window.location.assign('/login');
      });
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
